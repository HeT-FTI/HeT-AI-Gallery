<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>轻舟 · AI Gallery</title>
  <meta name="description" content="轻舟 AI Gallery：算法、模型与工程组件的统一入口。">
  <link id="siteFavicon" rel="icon" type="image/png" href="_static/pngs/logo.png?v=__BUILD__">
  <link rel="stylesheet" href="_static/gallery/css/style.css?v=__BUILD__">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("gallery-theme");
        if (!theme) {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      } catch (error) {
        /* ignore */
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="./" aria-label="轻舟 AI Gallery 首页">
        <span class="brand-mark" id="brandMark" aria-hidden="true">轻</span>
        <span class="brand-text">
          <span class="brand-name">轻舟</span>
          <span class="brand-sep">·</span>
          <span class="brand-sub">AI Gallery</span>
        </span>
      </a>

      <div class="header-actions">
        <label class="search" for="searchInput">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>
          <input id="searchInput" type="search" placeholder="搜索项目、分域或作者…"
            autocomplete="off" spellcheck="false" aria-label="搜索项目">
          <kbd class="search-kbd">⌘K</kbd>
        </label>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="切换深浅色" title="切换深浅色">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="container">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow" id="pageEyebrow">GALLERY INDEX</p>
        <h1 class="sr-only" id="pageTitle">轻舟 AI Gallery 索引</h1>
        <nav class="mode-switch" id="modeSwitch" aria-label="内容视图">
          <button class="mode-tab is-active" type="button" data-mode="projects" aria-pressed="true" data-focus-key="mode:projects">项目库</button>
          <button class="mode-tab" type="button" data-mode="cases" aria-pressed="false" data-focus-key="mode:cases">应用案例</button>
        </nav>
        <p class="hero-sub" id="sectionSubtitle">算法、模型与工程组件的统一入口。<span class="hero-note" id="sectionNote">分域与状态只是 seed，随时可改。</span></p>
      </div>
      <div class="hero-stats" id="heroStats" aria-label="项目统计"></div>
    </section>

    <section class="filter-bar" aria-label="筛选">
      <div class="tabs" id="viewTabs" role="group" aria-label="内容来源"></div>
      <div class="tabs" id="caseTabs" role="group" aria-label="案例关联对象" hidden></div>
      <div class="filter-row">
        <div class="chips" id="domainChips" role="group" aria-label="分域"></div>
        <div class="result-count" id="resultCount" aria-live="polite"></div>
      </div>
    </section>

    <section class="content" id="content">
      <div class="section-head" id="projectsHead">
        <div>
          <h2>自研项目</h2>
          <p>团队维护的库、SDK 与应用</p>
        </div>
        <div class="section-actions">
          <div class="layout-toggle" id="projectLayoutToggle" role="group" aria-label="项目布局">
            <button class="layout-btn is-active" type="button" data-project-layout="cards" aria-pressed="true" data-focus-key="project-layout:cards">卡片</button>
            <button class="layout-btn" type="button" data-project-layout="directory" aria-pressed="false" data-focus-key="project-layout:directory">目录</button>
          </div>
          <span class="section-count" id="projectsCount"></span>
        </div>
      </div>
      <div class="project-grid" id="projectGrid"></div>
      <div class="pagination" id="projectPagination" hidden></div>

      <section class="case-index" id="caseIndex" hidden aria-labelledby="caseHeadTitle">
        <div class="section-head" id="caseHead">
          <div>
            <h2 id="caseHeadTitle">应用案例</h2>
            <p id="caseHeadNote">从任务到结果：这些库在真实机器上解决了什么</p>
          </div>
          <div class="section-actions">
            <div class="layout-toggle" id="caseLayoutToggle" role="group" aria-label="案例布局">
              <button class="layout-btn is-active" type="button" data-case-layout="cards" aria-pressed="true" data-focus-key="case-layout:cards">精选</button>
              <button class="layout-btn" type="button" data-case-layout="directory" aria-pressed="false" data-focus-key="case-layout:directory">目录</button>
            </div>
            <span class="section-count" id="casesCount"></span>
          </div>
        </div>
        <div class="case-grid" id="caseGrid"></div>
        <div class="pagination" id="casePagination" hidden></div>
        <div class="empty-state" id="caseEmpty" hidden>
          <div class="empty-icon" aria-hidden="true">◌</div>
          <h3>没有匹配的案例</h3>
          <p>试试清空搜索，或回到全部案例。</p>
          <button class="btn btn-ghost" id="clearCaseFilters" type="button">清空案例筛选</button>
        </div>
      </section>

      <article class="case-detail" id="caseDetail" hidden aria-live="polite"></article>

      <section class="recipe-shelf" id="recipeShelf" hidden>
        <button class="shelf-toggle" id="shelfToggle" type="button" aria-expanded="false" aria-controls="recipeGrid">
          <span class="shelf-left">
            <span class="shelf-chevron" aria-hidden="true">▶</span>
            <span class="shelf-title" id="shelfTitle">第三方 Conan 配方</span>
            <span class="shelf-count" id="shelfCount">0</span>
            <span class="shelf-sub" id="shelfSub">上游不是我们写的，配方由我们维护</span>
          </span>
          <span class="shelf-right">
            <span class="shelf-pending" id="shelfPending"></span>
            <span class="shelf-cta" id="shelfCta">展开配方</span>
          </span>
        </button>
        <div class="recipe-grid" id="recipeGrid" hidden></div>
      </section>

      <div class="empty-state" id="emptyState" hidden>
        <div class="empty-icon" aria-hidden="true">◌</div>
        <h3>没有匹配的项目</h3>
        <p>试试换一个分域，或清空搜索。</p>
        <button class="btn btn-ghost" id="clearFilters" type="button">清空筛选</button>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="siteFooter" hidden>
    <div class="container footer-inner">
      <div class="footer-left" id="footerLeft"></div>
      <div class="footer-right" id="footerLinks"></div>
    </div>
  </footer>

  <noscript><div class="container noscript">这个预览需要 JavaScript。</div></noscript>
  <script src="_static/gallery/js/data.js?v=__BUILD__" defer></script>
  <script src="_static/gallery/js/app.js?v=__BUILD__" defer></script>
</body>
</html>
